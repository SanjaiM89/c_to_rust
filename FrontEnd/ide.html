<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>c_to_rust :: Web VS Code IDE</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Monaco Editor Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body style="height: 100vh; overflow: hidden;">
  <!-- Header Bar -->
  <header style="padding: 0.5rem 1.25rem;">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="/" class="brand" style="text-decoration: none;">
        <div class="brand-logo" style="width: 28px; height: 28px; font-size: 0.9rem;">🦀</div>
        <div class="brand-title" style="font-size: 1.05rem;">c_to_rust IDE</div>
      </a>
      <span id="active-crate-tag" class="brand-badge" style="background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border-color: rgba(16, 185, 129, 0.3);">Active Crate: inih-rs</span>
    </div>

    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <a href="/api/download" class="btn-download" style="padding: 0.4rem 0.85rem; font-size: 0.8rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Download .ZIP
      </a>
      <a href="/telemetry.html" target="_blank" class="btn-icon" style="text-decoration: none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        Telemetry
      </a>
      <a href="/" class="btn-icon" style="text-decoration: none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Dashboard
      </a>
    </div>
  </header>

  <!-- VS Code Web Workspace Layout -->
  <div class="ide-container">
    <!-- Activity Bar -->
    <div class="ide-activity-bar">
      <div class="ide-activity-icon active" title="Explorer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
      </div>
      <div class="ide-activity-icon" title="Search">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="ide-activity-icon" title="Source Control">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7M6 9v12"/></svg>
      </div>
    </div>

    <!-- Sidebar / File Explorer -->
    <div class="ide-sidebar">
      <div class="ide-sidebar-title">
        <span>EXPLORER: <span id="sidebar-root-name">CRATE</span></span>
        <button class="btn-icon" style="padding: 2px 6px; font-size: 0.7rem;" onclick="loadFileTree()">↻</button>
      </div>
      <div id="file-tree" class="ide-file-tree">
        <!-- Dynamically populated files -->
        <div style="padding: 1rem; color: #858585; font-size: 0.8rem;">Loading workspace files...</div>
      </div>
    </div>

    <!-- Main Editor Area -->
    <div class="ide-editor-area">
      <!-- Tabs Bar -->
      <div id="editor-tabs" class="ide-tabs-bar">
        <div class="ide-tab active" id="active-tab">
          <span id="tab-filename">src/lib.rs</span>
        </div>
      </div>

      <!-- Monaco Editor Mount Container -->
      <div id="monaco-container" class="ide-monaco-mount"></div>

      <!-- VS Code Status Bar -->
      <div class="ide-status-bar">
        <div style="display: flex; gap: 1rem; align-items: center;">
          <span>main*</span>
          <span>0 errors, 0 warnings</span>
          <span id="status-safety" style="background: rgba(255,255,255,0.2); padding: 1px 6px; border-radius: 3px;">100% Safe Rust</span>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
          <span id="status-cursor">Ln 1, Col 1</span>
          <span>Spaces: 4</span>
          <span>UTF-8</span>
          <span id="status-lang">Rust</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/ide.js"></script>
</body>
</html>
